[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-lakehouse-decision"
version = "0.1.0"
description = "A Synapse estate has to go somewhere. Fabric or Databricks-on-Azure, made explicit, priced against Fabric's capacity model, and runnable."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Farid Gurbanov" }]
keywords = [
    "microsoft-fabric",
    "databricks",
    "azure-synapse",
    "event-hubs",
    "structured-streaming",
    "lakehouse",
    "data-architecture",
]
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "duckdb>=1.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
# Real Delta tables — transaction log, time travel, MERGE — with no Spark and no
# JVM. It is an extra rather than a dependency because ADR-0001 requires `make demo`
# to run on a laptop with nothing installed but Python; the streaming simulation
# degrades to a Parquet-backed table and says so when it is missing.
delta = ["deltalake>=0.18"]

[project.scripts]
azlake = "azlake.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
