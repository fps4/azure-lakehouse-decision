# The cost model.
#
# ILLUSTRATIVE PLACEHOLDERS, shaped like list pricing. Not quotes, not a rate card,
# not a client's contract. They live in one file precisely so they can be replaced
# with real ones — and every report that prints a euro figure repeats that sentence
# (ADR-0006).
#
# The durable content of this file is not the numbers. It is the *shape*:
#
#   Fabric      a pre-paid capacity. One bill for the whole estate. The marginal
#               cost of one more workload is zero — until the capacity saturates,
#               and then it is the price of the next F-SKU. A step function.
#   Databricks  metered, per DBU. Near-zero fixed cost, a straight line in
#               consumption.
#   Snowflake   metered, per credit. The same shape as Databricks, a different
#               slope on each surface — and that difference is the only reason
#               having both in the comparison is worth anything.
#
# A step function against a straight line is a different argument from two straight
# lines (ADR-0003). Two straight lines with different slopes is a third argument
# again, and it is the one that decides between the two metered platforms.
#
# One cost in this file is neither: `platform_overhead_eur_per_month` attaches to a
# platform *being operated at all*. It is not divisible by workload, which makes it
# non-additive in exactly the way a capacity rung is — the reason R9 exists
# (ADR-0007).

currency: EUR
hours_per_month: 730.0

fabric:
  # F-SKU ladder. Capacity units are the currency Fabric bills in; every workload
  # consumes CU-seconds from the one pool.
  skus: [2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048]
  eur_per_cu_hour: 0.20
  # A one-year reservation trades the ability to pause for a discount. The estate
  # here runs continuously, so the reservation is the honest comparison.
  reservation_discount: 0.41
  use_reservation: true

  # Demand conversion: physical driver → capacity units. These factors are the most
  # arguable numbers in the repo and the most important. Disagreeing with them is a
  # pull request against this file, and the plan re-renders with the consequence.
  cu_hours_per_compute_hour:
    warehouse: 11.0
    lakehouse: 9.0
    data_factory: 2.0
    # An Eventhouse is always on, so its compute term is a floor rather than a
    # driver. The driver is the event rate, below.
    eventhouse: 0.8
  cu_hours_per_tb_scanned:
    warehouse: 2.5
    lakehouse: 4.0
    data_factory: 0.0
    eventhouse: 1.1
  # Ingestion is what a streaming platform actually charges for, and an event rate
  # is the only honest way to separate a 14,000/s telemetry firehose from a 900/s
  # payment ledger. Both are "one always-on stream" if you count compute hours.
  cu_hours_per_billion_events:
    eventhouse: 55.0

  # OneLake storage is billed outside the capacity.
  storage_eur_per_gb_month: 0.021
  # Eventhouse keeps a hot cache sized by retention; it is the part of a KQL database
  # that surprises people on the invoice.
  eventhouse_hot_cache_eur_per_gb_month: 0.11

# Every metered platform is described the same way, because they are the same shape:
# a billing unit, a price per unit that may vary by surface, and the conversion from
# a physical driver to units. Adding a fourth metered platform is an entry here and
# nothing in Python (ADR-0005, ADR-0007).
metered:

  databricks:
    unit: DBU-h
    # Effective €/DBU-hour including the Azure VM underneath, except where the SKU is
    # serverless and the compute is inside the DBU rate.
    eur_per_unit:
      sql_warehouse: 0.62
      jobs_compute: 0.26
      workflows: 0.26
      structured_streaming: 0.31
    units_per_compute_hour:
      sql_warehouse: 6.0
      jobs_compute: 5.0
      workflows: 1.2
      structured_streaming: 0.6
    units_per_tb_scanned:
      sql_warehouse: 1.6
      jobs_compute: 1.2
      workflows: 0.0
      structured_streaming: 0.15
    units_per_billion_events:
      structured_streaming: 40.0

    # ADLS Gen2, hot tier.
    storage_eur_per_gb_month: 0.018

  snowflake:
    unit: credit
    # One credit price across the account — Snowflake charges by credit and edition,
    # not by surface, so the surface differentiation lives entirely in the conversion
    # factors below. That is a real difference in how the two meters are shaped, and
    # flattening it away would hide it.
    eur_per_unit:
      virtual_warehouse: 2.85
      snowpark: 2.85
      tasks_streams: 2.85
      snowpipe_streaming: 2.85
    units_per_compute_hour:
      # A virtual warehouse bills per second while it is running and auto-suspends
      # when it is not, so a BI-shaped hour of *query* costs less than an hour of
      # warehouse uptime would suggest. This factor is that, not a warehouse size.
      # It is where Snowflake is genuinely strong against both alternatives, and the
      # reason it is in the comparison at all: €2.85/compute-hour here against
      # €3.72 for a Databricks SQL warehouse in the numbers above.
      virtual_warehouse: 1.0
      # Snowpark for a Spark-shaped transformation is the expensive end of this
      # platform, and it is why the notebooks in this estate do not land here.
      snowpark: 2.6
      tasks_streams: 0.5
      snowpipe_streaming: 0.35
    units_per_tb_scanned:
      # Near parity with Databricks SQL on scan — €1.08/TB here against €0.99 — which
      # is the most defensible reading of the published comparisons: the two engines
      # trade places depending on the query shape and on who commissioned the
      # benchmark. Anything claiming a large gap in either direction is selling
      # something. Replace with a measurement on your own queries before it decides
      # anything; nothing in this repo measures either engine (ADR-0001).
      virtual_warehouse: 0.38
      snowpark: 0.5
      tasks_streams: 0.0
      snowpipe_streaming: 0.06
    units_per_billion_events:
      snowpipe_streaming: 22.0

    # Snowflake-managed storage, compressed, billed on the flat monthly rate.
    storage_eur_per_gb_month: 0.023

# Costs that attach to a *platform being operated at all*, not to any one workload:
# the contract, the landing zone, the identity integration, the network path, the
# people who know it. Three platforms means three of these, which is the number the
# "just use whichever is cheapest per workload" answer forgets — and the reason a
# platform that wins a handful of workloads on the meter can still lose the estate
# (R9, ADR-0007).
platform_overhead_eur_per_month:
  fabric: 900.0
  databricks: 1400.0
  snowflake: 1200.0

# What it costs to move one workload off Synapse, amortised across the programme so
# it can sit in the same monthly number as everything else. A T-SQL surface that has
# to be rewritten rather than lifted is the expensive case, which is exactly why R2
# eliminates rather than penalises.
migration:
  amortise_months: 24.0
  eur_per_workload:
    dedicated_sql: 34000.0
    serverless_view: 9000.0
    spark_notebook: 21000.0
    pipeline: 12000.0
    stream: 46000.0
  # Multiplier applied when the target platform cannot host the source's T-SQL
  # surface and the workload has to be re-expressed rather than moved.
  tsql_rewrite_multiplier: 2.4
