# ---- the streams -------------------------------------------------------------
# Event Hub is the source for all four. Where they differ is what has to be true of
# the answer, and that is what splits Eventhouse from Structured Streaming.

- id: STR_DEVICE_TELEMETRY
  name: Device telemetry — operational monitoring
  domain: iot
  kind: stream
  tsql_surface: none
  size_gb: 4200.0
  compute_hours_per_month: 730.0
  gb_scanned_per_month: 52000.0
  consumer: app
  latency_class: subsecond
  peak_concurrency: 40
  latency_slo_seconds: 2.0
  events_per_second: 14000
  retention_days: 90
  # Append-only, queried by ingestion time, never restated. The shape KQL was built for.
  late_arrival_tolerance_minutes: 0
  exactly_once_required: false
  governance: { residency: [westeurope, northeurope], pii: false, classification: internal }

- id: STR_CLICKSTREAM
  name: Web clickstream — product analytics
  domain: sales
  kind: stream
  tsql_surface: none
  size_gb: 1600.0
  compute_hours_per_month: 730.0
  gb_scanned_per_month: 21000.0
  consumer: app
  latency_class: subsecond
  peak_concurrency: 25
  latency_slo_seconds: 3.0
  events_per_second: 6500
  retention_days: 120
  late_arrival_tolerance_minutes: 0
  exactly_once_required: false
  governance: { residency: [westeurope, northeurope], pii: false, classification: internal }

- id: STR_PAYMENTS
  name: Payment events — settlement ledger
  domain: finance
  kind: stream
  tsql_surface: none
  size_gb: 380.0
  compute_hours_per_month: 730.0
  gb_scanned_per_month: 4200.0
  consumer: app
  latency_class: interactive
  peak_concurrency: 10
  latency_slo_seconds: 15.0
  events_per_second: 900
  retention_days: 2555
  # Mobile clients go offline and settle late. The window has to be *restated* by
  # event time when they come back, and the same payment must never be counted
  # twice. Those two sentences are the whole reason this workload is not an
  # append-only telemetry stream.
  late_arrival_tolerance_minutes: 120
  exactly_once_required: true
  governance: { residency: [westeurope], pii: true, classification: restricted }

