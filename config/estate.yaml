# The Synapse estate, as a catalog.
#
# Invented, not a client's — see the honesty statement in README.md. Shaped like a
# mid-size Azure analytics estate that grew through Synapse Analytics between 2020
# and 2024: a dedicated SQL pool carrying the finance and sales warehouse, serverless
# views over ADLS for the raw zone, Spark notebooks doing the heavy transformation,
# pipelines orchestrating it, and a telemetry stream that arrived later and never
# quite fitted.
#
# Every field here is an *estate fact*, never a preference. Preferences live in
# policy.yaml and cost_model.yaml (ADR-0005).
#
# kind:            dedicated_sql | serverless_view | spark_notebook | pipeline | stream
# tsql_surface:    none | queries | procedures | transactions
#   procedures   — stored procedures, T-SQL control flow
#   transactions — multi-table transactional writes (BEGIN TRAN across tables)
# consumer:        powerbi_direct_lake | powerbi_import | sql_client | notebook | app | ml
# latency_class:   interactive | batch | subsecond

