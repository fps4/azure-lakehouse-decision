name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Decide (writes the plan and the charts)
        run: python -m azlake decide

      - name: Simulate (executes both platform shapes)
        run: python -m azlake simulate

      - name: Tests
        run: pytest -q

      # The plan is deterministic, so a stale one means the committed decisions no
      # longer match the code that claims to produce them. The simulation report is
      # excluded on purpose: it is deterministic in content but is regenerated
      # alongside timings-adjacent prose, and gating it adds noise without adding a
      # guarantee the plan gate does not already give.
      - name: The plan must match the code that produced it
        run: |
          git diff --exit-code -- reports/plan.md \
            || (echo "::error::reports/plan.md is stale — run 'make decide' and commit it" && exit 1)

      - name: Upload the reports
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/
          retention-days: 14

  # The optional extra gets its own job so the default path stays provably
  # dependency-light (ADR-0001): if this job is the only one that installs
  # `deltalake`, then `verify` passing proves the simulation degrades without it.
  delta:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install with the delta extra
        run: |
          python -m pip install -U pip
          pip install -e ".[dev,delta]"
      - name: Simulate, materialising a real Delta table
        run: python -m azlake simulate
      - name: The sink must actually be a Delta table
        run: test -d data/delta/payments_by_window/_delta_log
